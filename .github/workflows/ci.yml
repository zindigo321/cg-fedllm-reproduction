name: ci

on:
  push:
  pull_request:

jobs:
  cpu-tests:
    name: Linux CPU tests (no pretrained models)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements/ci-cpu.txt
          python -m pip install -e . --no-deps
      - name: Lint
        run: ruff check src tests scripts
      - name: Tests (gpu/model-marked tests are skipped; the Hub is offline)
        env:
          HF_HUB_OFFLINE: "1"
        run: pytest -q -m "not gpu and not model"
